name: Android smoke test

# Builds an x86_64 APK, starts it on an emulator and saves a screenshot + logcat.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke (start, open, intents), scan, or ai (scanner AI flattening)'
        default: smoke

permissions:
  contents: write

concurrency:
  group: android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: node scripts/build-worker.mjs

      - name: Generate the native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (x86_64 for the emulator)
        working-directory: android
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_WEBVIEW_DEBUG: '1'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: KVM check
        run: |
          echo "::warning title=kvm::$(ls -l /dev/kvm 2>&1) vmx/svm cpus: $(grep -cE 'vmx|svm' /proc/cpuinfo) nproc: $(nproc) $(lscpu | grep -i 'model name' | head -1)"

      - name: Run on emulator
        timeout-minutes: 32
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # a hung adb / DevTools call must not eat the whole job: stop after 25 min, keep the log and logcat
          script: mkdir -p out && timeout -k 20 1200 bash .github/scripts/${{ inputs.suite == 'scan' && 'smoke-scan.sh' || inputs.suite == 'ai' && 'smoke-ai.sh' || 'smoke.sh' }} > out/run.log 2>&1; adb logcat -d > out/logcat-end.txt; true

      - name: Publish results as a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out; date -u > out/published-at.txt; ls -la out | head -20
          cat out/logcat*.txt | grep -iE "CONSOLE|chromium|ReactNativeJS|AndroidRuntime|WebView" | head -200 || true
          gh release create "smoke-${{ github.run_number }}" out/* --prerelease --target "${GITHUB_SHA}" \
            --title "Smoke test ${{ github.run_number }}" --notes "Emulator screenshots and logcat."
