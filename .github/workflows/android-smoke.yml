name: Android smoke test

# Builds an x86_64 APK, starts it on an emulator and saves a screenshot + logcat.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke (start, open, intents) or scan'
        default: smoke

permissions:
  contents: write

concurrency:
  group: android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (x86_64 for the emulator)
        working-directory: android
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_WEBVIEW_DEBUG: '1'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/${{ inputs.suite == 'scan' && 'smoke-scan.sh' || 'smoke.sh' }}

      - name: Publish results as a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -iE "CONSOLE|chromium|ReactNativeJS|AndroidRuntime|WebView" out/logcat.txt | head -200 || true
          gh release create "smoke-${{ github.run_number }}" out/* --prerelease --target "${GITHUB_SHA}" \
            --title "Smoke test ${{ github.run_number }}" --notes "Emulator screenshots and logcat."
