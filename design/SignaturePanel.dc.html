<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:20px;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:var(--text,#151833);font-size:14px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="flex:1;font-size:20px;font-weight:600;letter-spacing:-.01em;">Add signature</div>
    <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted,#5D637A);" style-hover="background:var(--surface2,#F5F6F9);"><i class="ph ph-x"></i></div>
  </div>
  <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div style="font-size:13px;font-weight:500;color:var(--muted,#5D637A);">Saved on this device</div>
    <div style="display:flex;gap:10px;overflow-x:auto;">
      <div style="position:relative;flex:none;width:150px;height:64px;border-radius:12px;border:1px solid var(--line,#E1E4EB);display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:28px;color:#1E2559;" style-hover="border-color:var(--ink,#1E2559);">Jordan Ellis<div style="position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted,#5D637A);"><i class="ph ph-x"></i></div></div>
      <div style="position:relative;flex:none;width:110px;height:64px;border-radius:12px;border:1px solid var(--line,#E1E4EB);display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:30px;color:#14161F;">J.E.</div>
    </div>
  </div>
  </sc-if>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:4px;background:var(--surface2,#F0F2F6);border-radius:12px;">
    <div style="height:40px;border-radius:9px;background:var(--surface,#fff);box-shadow:0 1px 3px rgba(20,23,46,.12);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;"><i class="ph ph-scribble"></i>Draw</div>
    <div style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted,#5D637A);font-weight:500;"><i class="ph ph-keyboard"></i>Type</div>
    <div style="height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted,#5D637A);font-weight:500;"><i class="ph ph-upload-simple"></i>Upload</div>
  </div>
  <div style="position:relative;height:{{ padH }};border-radius:14px;background:var(--surface2,#F7F8FA);border:1px dashed var(--line,#CDD1DB);display:flex;align-items:center;justify-content:center;">
    <div style="position:absolute;left:28px;right:28px;bottom:34%;border-top:1px solid var(--line,#CDD1DB);"></div>
    <div style="position:absolute;left:28px;bottom:calc(34% + 6px);font-size:16px;color:var(--muted,#9AA0B4);"><i class="ph ph-x"></i></div>
    <div style="font-family:'Caveat',cursive;font-size:64px;color:#1E2559;transform:rotate(-3deg) translateY(-8px);">Jordan Ellis</div>
    <div style="position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted,#5D637A);">Sign with finger, pen or mouse</div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:13px;font-weight:500;color:var(--muted,#5D637A);">Ink</span>
      <div style="width:28px;height:28px;border-radius:50%;background:#14161F;"></div>
      <div style="width:28px;height:28px;border-radius:50%;background:#1E2559;box-shadow:0 0 0 2px var(--surface,#fff),0 0 0 4px var(--ink,#1E2559);"></div>
      <div style="width:28px;height:28px;border-radius:50%;background:#2F5BD3;"></div>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:10px;min-height:44px;"><div style="width:22px;height:22px;border-radius:6px;background:var(--ink,#1E2559);color:var(--on-ink,#fff);display:flex;align-items:center;justify-content:center;font-size:14px;"><i class="ph-bold ph-check"></i></div><span style="font-weight:500;">Save on this device</span></div>
  </div>
  <div style="display:flex;gap:10px;">
    <div style="height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line,#E1E4EB);display:flex;align-items:center;gap:8px;font-weight:600;" style-hover="background:var(--surface2,#F5F6F9);"><i class="ph ph-arrow-counter-clockwise"></i>Clear</div>
    <div style="flex:1;height:48px;border-radius:12px;background:var(--ink,#1E2559);color:var(--on-ink,#fff);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;" style-hover="background:var(--ink2,#2B3478);"><i class="ph-bold ph-signature"></i>Place signature</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:620},&quot;saved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { hasSaved: this.props.saved ?? true, padH: this.props.compact ? '180px' : '220px' };
  }
}
</script>
</body>
</html>
