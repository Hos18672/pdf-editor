plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rezahossaini.peintents'
version = '1.0.0'

android {
  namespace "com.rezahossaini.peintents"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // keeps Google's document scanner intact in the release build (see proguard-rules.pro)
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core:1.13.1'
  // Google's document scanner (the scanner UI and model come from Google Play services)
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
